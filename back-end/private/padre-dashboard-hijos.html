<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador | Ministario de Educación Pública</title>
    <link rel="icon" href="/images/logo_mep.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/administrador-dashboard.css">
</head>
<body class="contenedor-dashboar-padre">
    
    <div class="row" id="fila">
        <div class="col-2" id="columna-1">
            <div class="menuLateral">
                <div class="row" id="nombrePadre">
                    <div id="cargarNombrePadre"></div>
                </div>
                <div class="row" id="menuLateral">
                    <div class="menu-item">
                        <div class="icon-col"><img src="images/hogar.png" alt="Casa"></div>
                        <div class="text-col"><a href="/padre-dashboard">Inicio</a></div>
                    </div>
                    <div class="menu-item" style="background-color: #d1d1d1;">
                        <div class="icon-col"><img src="images/conocimiento.png" alt="Grado"></div>
                        <div class="text-col"><a href="/padre-dashboard-hijos">Hijos</a></div>
                    </div>
                    <div class="menu-item" id="menuLateralUtiles">
                        <div class="icon-col"><img src="images/utiles-escolares (1).png" alt="Útiles"></div>
                        <div class="text-col"><a href="/padre-dashboard-listas">Listas</a></div>
                    </div>
                    <div class="menu-item">
                        <div class="icon-col"><img src="images/configuraciones.png" alt="Listas"></div>
                        <div class="text-col" id="opcionesConfiguracion"><a href="#">Configuración</a></div>
                    </div>
                    <ul class="listaConfiguracion">
                        <li><a href="/iniciar">Cerrar Sesión</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="col-10" id="columna-2">
            <div class="row" id="administradorInicio">
                <div class="col-8" id="columna-3">
                    <h1>Panel de padre</h1>
                    <h2>Hijos registrados</h1>
                </div>
                <div class="col-4" id="columna-4">
                    <button class="crearUsuario" id="registrarHijo" data-bs-toggle="modal" data-bs-target="#hijoModal">Registrar Hijo</button>
                </div>
            </div>
            <div class="row" style="padding: 20px;">
                <table id="tablaHijos" class="table table-striped table-bordered">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Apellidos</th>
                            <th class="text-center">Grado</th>
                            <th class="text-center">Acción</th>
                            <th class="text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="bodyTablaHijos">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="hijoModal" tabindex="-1" aria-labelledby="hijoModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">         
            <div class="modal-header">
                <h5 class="modal-title" id="hijoModalLabel">Registrar Hijo</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>         
            <div class="modal-body">
                <form id="hijoForm" novalidate>
                    <div class="mb-3">
                        <label for="registrarNombreHijo" class="form-label">Nombre</label>
                        <input id="registrarNombreHijo" class="form-control" name="registrarNombreHijo" type="text" placeholder="Ej: Manfred" required>
                        <div class="invalid-feedback">Por favor el nombre.</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="registrarApellidosHijo" class="form-label">Apellidos</label>
                        <input id="registrarApellidosHijo" class="form-control" name="registrarApellidosHijo" type="text" placeholder="Ej: Lagos Rodríguez" required>
                        <div class="invalid-feedback">Por favor ingrese los apellidos.</div>
                    </div>

                    <div class="mb-3">
                        <label for="registrarGradoHijo" class="form-label">Grado:</label>
                        <select id="registrarGradoHijo" class="form-select editarGrado">
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Volver</button>
                <button type="submit" form="hijoForm" id="btnRegistrarHijo" class="btn btn-primary">Crear registro</button>
            </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editarHijoModal" tabindex="-1" aria-labelledby="editarHijoLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editarHijoLabel">Editar información hijo</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <form id="editarHijoForm">
                    <input type="hidden" id="editarIdHijo">
                    <div class="mb-3">
                        <label for="editarNombreHijo" class="form-label">Nombre:</label>
                        <input type="text" class="form-control" id="editarNombreHijo" required>
                    </div>
                    <div class="mb-3">
                        <label for="editarApellidosHijo" class="form-label">Apellidos:</label>
                        <input type="text" class="form-control" id="editarApellidosHijo" required>
                    </div>
                    <div class="mb-3">
                        <label for="editarGradoHijo" class="form-label">Grado:</label>
                        <select id="editarGradoHijo" class="form-select editarGrado">
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" form="editarHijoForm" id="btnGuardarEdicionHijo" class="btn btn-primary">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script src="js/usuario_mep-listar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/registrar-usuario-administrador.js"></script>
    <script src="/js/hijos-listar.js"></script>
    <script src="/js/funcionalidades-padre.js"></script>
</body>
</html>
