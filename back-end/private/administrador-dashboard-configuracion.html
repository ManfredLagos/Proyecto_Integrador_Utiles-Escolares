<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador | Ministario de Educación Pública</title>
    <link rel="icon" href="/images/logo_mep.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/administrador-dashboard.css">
</head>
<body class="contenedor-dashboar-administrador">
    <div class="row" id="fila">
        <div class="col-2" id="columna-1">
            <div class="menuLateral">
                <div class="row" id="nombreUsuario">
                    <div id="cargarNombreUsuario"></div>
                </div>
                <div class="row" id="menuLateral">
                    <div class="menu-item">
                        <div class="icon-col"><img src="images/hogar.png" alt="imgCasa"></div>
                        <div class="text-col"><a href="/administrador-dashboard">Inicio</a></div>
                    </div>
                    <div class="menu-item">
                        <div class="icon-col"><img src="images/anadir-grupo.png" alt="imgUsuario"></div>
                        <div class="text-col"><a href="/administrador-dashboard-usuarios">Usuarios</a></div>
                    </div>
                    <div class="menu-item">
                        <div class="icon-col"><img src="images/conocimiento.png" alt="imgGrado"></div>
                        <div class="text-col"><a href="/administrador-dashboard-grados">Grados</a></div>
                    </div>
                    <div class="menu-item" id="menuLateralUtiles">
                        <div class="icon-col"><img src="images/utiles-escolares (1).png" alt="imgÚtiles"></div>
                        <div class="text-col"><a href="/administrador-dashboard-utiles">Útiles</a></div>
                    </div>
                    <div class="menu-item" style="background-color: #d1d1d1;">
                        <div class="icon-col"><img src="images/configuraciones.png" alt="imgConfiguración"></div>
                        <div class="text-col" id="opcionesConfiguracion"><a href="#">Configuración</a></div>
                    </div>
                    <ul class="listaConfiguracion">
                        <li><a href="/iniciar">Cerrar Sesión</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="col-10" id="columna-2">
            <div class="row" id="administradorInicio">
                <div class="col-12" id="columna-3">
                    <h1>Panel de administrador</h1>
                    <h2>Configuración</h1>
                </div>
            </div>
            <div class="row" style="padding: 20px">
                <div class="formularioInformacionPeronal">
                    <form id="editarUsuarioPersonalForm">
                        <div class="mb-3">
                            <label for="editarNombrePersonal" class="form-label">Nombre:</label>
                            <input type="text" class="form-control" id="editarNombrePersonal" required>
                        </div>
                        <div class="mb-3">
                            <label for="editarApellidosPersonal" class="form-label">Apellidos:</label>
                            <input type="text" class="form-control" id="editarApellidosPersonal" required>
                        </div>
                        <div class="mb-3">
                            <label for="editarCorreoPersonal" class="form-label">Correo electrónico:</label>
                            <input type="email" class="form-control" id="editarCorreoPersonal" required>
                        </div>
                        <div class="mb-3">
                            <label for="editarUsuarioPersonal" class="form-label">Usuario:</label>
                            <input type="text" class="form-control" id="editarUsuarioPersonal" required>
                        </div>
                        <div class="mb-3">
                            <label for="editarRolPersonal" class="form-label">Rol:</label>
                            <select id="editarRolPersonal" class="form-select" required>
                            <option value="padre">Padre</option>
                            <option value="docente">Docente</option>
                            <option value="administrador">Administrador</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="editarGrado" class="form-label">Grado:</label>
                            <select id="editarGradoPersonal" class="form-select editarGrado">
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="editarEstado" class="form-label">Estado:</label>
                            <select id="editarEstadoPersonal" class="form-select editarEstado">
                            </select>
                        </div>

                        <div class="btnFormularioInformacionPersonal">
                            <button type="submit" form="editarUsuarioForm" class="btn btn-primary">Guardar Cambios</button>
                        </div>
                    </form>
                </div>
            </div>        
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script src="js/usuario_mep-listar.js"></script>
    <script src="js/registrar-usuario-administrador.js"></script>
    <script src="js/usuario-iniciar.js"></script>

    <script>
document.addEventListener("DOMContentLoaded", async () => {
  const usuarioId = localStorage.getItem('usuarioId');
  if (!usuarioId) {
    // Si no hay usuario guardado, redirigir o mostrar mensaje
    console.warn('No se encontró usuarioId en localStorage');
    return;
  }

  try {
    const response = await fetch(`http://localhost:3000/usuario_mep/${usuarioId}`);
    if (!response.ok) throw new Error("Error al obtener información del usuario");

    const data = await response.json();
    const usuario = data.usuario;

    if (!usuario) {
      console.warn("No se encontró la información del usuario en la respuesta");
      return;
    }

    // Asignar valores a inputs
    document.getElementById("editarNombrePersonal").value = usuario.nombre || "";
    document.getElementById("editarApellidosPersonal").value = usuario.apellidos || "";
    document.getElementById("editarCorreoPersonal").value = usuario.correo || "";
    document.getElementById("editarUsuarioPersonal").value = usuario.usuario || "";
    document.getElementById("editarRolPersonal").value = usuario.rol || "";

    // Para selects múltiples (grado y estado),
    // primero limpiar selección actual
    const selectGrado = document.getElementById("editarGradoPersonal");
    const selectEstado = document.getElementById("editarEstadoPersonal");

    // Limpiar opciones seleccionadas
    Array.from(selectGrado.options).forEach(option => option.selected = false);
    Array.from(selectEstado.options).forEach(option => option.selected = false);

    // Marcar las opciones que coinciden con los IDs recibidos del usuario
    if (Array.isArray(usuario.grado)) {
      usuario.grado.forEach(g => {
        const option = Array.from(selectGrado.options).find(opt => opt.value === (g._id || g));
        if (option) option.selected = true;
      });
    }

    if (Array.isArray(usuario.estado)) {
      usuario.estado.forEach(e => {
        const option = Array.from(selectEstado.options).find(opt => opt.value === (e._id || e));
        if (option) option.selected = true;
      });
    }

  } catch (error) {
    console.error("Error cargando datos del usuario:", error);
    // Opcional: mostrar alerta para el usuario
  }
});


    </script>

</body>
</html>
