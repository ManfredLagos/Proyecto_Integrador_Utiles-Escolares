<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador | Ministario de Educación Pública</title>
    <link rel="icon" href="/images/logo_mep.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/administrador-dashboard.css">
</head>
<body class="contenedor-dashboar-administrador">
    <div class="row" id="fila">
        <div class="col-2" id="columna-1">
            <div class="menuLateral">
                <div class="row" id="nombreUsuario">
                    <div id="cargarNombreUsuario"></div>
                </div>
                <div class="row" id="menuLateral">
                    <div class="menu-item">
                        <div class="icon-col"><img src="images/hogar.png" alt="imgCasa"></div>
                        <div class="text-col"><a class="link-simular-carga" href="/administrador-dashboard">Inicio</a></div>
                    </div>
                    <div class="menu-item">
                        <div class="icon-col"><img src="images/anadir-grupo.png" alt="imgUsuario"></div>
                        <div class="text-col"><a class="link-simular-carga" href="/administrador-dashboard-usuarios">Usuarios</a></div>
                    </div>
                    <div class="menu-item">
                        <div class="icon-col"><img src="images/conocimiento.png" alt="imgGrado"></div>
                        <div class="text-col"><a class="link-simular-carga" href="/administrador-dashboard-grados">Grados</a></div>
                    </div>
                    <div class="menu-item" id="menuLateralUtiles" style="background-color: #d1d1d1;">
                        <div class="icon-col"><img src="images/utiles-escolares (1).png" alt="imgÚtiles"></div>
                        <div class="text-col"><a href="/administrador-dashboard-utiles">Útiles</a></div>
                    </div>
                    <div class="menu-item">
                        <div class="icon-col"><img src="images/configuraciones.png" alt="imgConfigutacion"></div>
                        <div class="text-col" id="opcionesConfiguracion"><a href="#">Configuración</a></div>
                    </div>
                    <ul class="listaConfiguracion">
                        <li><a href="/iniciar">Cerrar Sesión</a></li>
                    </ul>
                </div>
            </div>
        </div>
        
        <div class="col-10" id="columna-2">
            <div class="row" id="administradorInicio">
                <div class="col-8" id="columna-3">
                    <h1>Panel de administrador</h1>
                    <h2>Útiles escolares</h1>
                </div>
                <div class="col-4" id="columna-4">
                    <button class="crearUsuario" id="crearUtil" data-bs-toggle="modal" data-bs-target="#crearUtilModal">Crear Nuevo Útil</button>
                </div>
            </div>
            <div class="row" style="padding: 20px;">
                <table id="tablaUtiles" class="table table-striped table-bordered">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th class="text-center">Cantidad</th>
                            <th class="text-center">Acción</th>
                            <th class="text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaUtiles">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="crearUtilModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">           
                <div class="modal-header">
                    <h5 class="modal-title" id="loginModalLabel">Registrar Útil</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>             
                <div class="modal-body">
                    <form id="crearUtilForm" novalidate>
                        <div class="mb-3">
                            <label for="nombreUtil" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombreUtil" required>
                            <div id="nombreUtilError" class="invalid-feedback">Por favor ingrese el nombre del nuevo útil.</div>
                        </div>
                        <div class="mb-3">
                            <label for="descripcionUtil" class="form-label">Descripción</label>
                            <input type="text" class="form-control" id="descripcionUtil" required>
                            <div id="descripcionUtilError" class="invalid-feedback">Por favor ingrese la descripción.</div>
                        </div>
                        <div class="mb-3">
                            <label for="cantidadUtil" class="form-label">Cantidad</label>
                            <input type="number" class="form-control" id="cantidadUtil" required>
                            <div id="cantidadUtilError" class="invalid-feedback">Por favor ingrese la cantidad.</div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Volver</button>
                    <button type="submit" form="crearUtilForm" id="btnCrearUtil" class="btnCrear btn btn-primary">Crear Útil</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editarUtilModal" tabindex="-1" aria-labelledby="editarUtilLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">        
                <div class="modal-header">
                    <h5 class="modal-title" id="editarUtilLabel">Editar Útiles</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form id="editarUtilesForm">
                        <input type="hidden" id="editarIdUtil">
                        <div class="mb-3">
                            <label for="editarNombreUtil" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="editarNombreUtil" required>
                        </div>
                        <div class="mb-3">
                            <label for="editarDescripcionUtil" class="form-label">Descripción</label>
                            <input type="email" class="form-control" id="editarDescripcionUtil" required>
                        </div>
                        <div class="mb-3">
                            <label for="editarCantidadUtil" class="form-label">Cantidad</label>
                            <input type="number" class="form-control" id="editarCantidadUtil" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" form="editarUsuarioForm" class="btnGuardar btn btn-primary" id="btnGuardarEdicionUtil">Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>

    <div id="loading" class="cargar">
        <img src="images/loading2.gif" alt="Cargando..." style="width:100%; height:100%;">
    </div>

    <!-- Div de sombra -->
    <div id="shadow" class="sombra"></div>

    <!-- Incluir Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script src="js/usuario_mep-listar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/registrar-usuario-administrador.js"></script>
    <script src="/js/utiles-listar.js"></script>
    <script src="/js/animaciones.js"></script>
</body>
</html>
