<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador | Ministario de Educación Pública</title>
    <link rel="icon" href="/images/logo_mep.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/administrador-dashboard.css">
</head>
<body class="contenedor-dashboar-administrador">
    
    <div class="row" id="fila">
        <div class="col-2" id="columna-1">
            <div class="menuLateral">
                <div class="row" id="nombreUsuario">
                    <div id="cargarNombreDocente"></div>
                </div>
                <div class="row" id="menuLateral">
                    <div class="menu-item">
                        <div class="icon-col"><img src="images/hogar.png" alt="Casa"></div>
                        <div class="text-col"><a class="link-simular-carga" href="/docente-dashboard">Inicio</a></div>
                    </div>
                    <div class="menu-item" id="menuLateralUtiles" style="background-color: #d1d1d1;">
                        <div class="icon-col"><img src="images/portapapeles.png" alt="Listas"></div>
                        <div class="text-col"><a href="/docente-dashboard-listas">Listas</a></div>
                    </div>
                    <div class="menu-item">
                        <div class="icon-col"><img src="images/configuraciones.png" alt="Configuración"></div>
                        <div class="text-col" id="opcionesConfiguracion"><a href="#">Configuración</a></div>
                    </div>
                    <ul class="listaConfiguracion">
                        <li><a href="/iniciar">Cerrar Sesión</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="col-10" id="columna-2">
            <div class="row" id="administradorInicio">
                <div class="col-8" id="columna-3">
                    <h1>Panel de Docente</h1>
                    <h2>Listas de útiles escolares</h1>
                </div>
                <div class="col-4" id="columna-4">
                    <button id="crearLista" class="crearUsuario" data-bs-toggle="modal" data-bs-target="#listaModal">Crear Lista</button>
                </div>
            </div>
            <div class="row" style="padding: 20px;">
                <table id="tablaListas" class="table table-striped table-bordered">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th class="text-center">Útiles</th>
                            <th class="text-center">Grados</th>
                            <th class="text-center">Acción</th>
                            <th class="text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaLista">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div class="modal fade" id="listaModal" tabindex="-1" aria-labelledby="ListaModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">           
                <div class="modal-header">
                    <h5 class="modal-title" id="ListaModalLabel">Registrar Lista</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>             
                <div class="modal-body">
                    <form id="crearListaForm" novalidate>
                        <div class="mb-3">
                            <label for="nombreLista" class="form-label">Nombre: </label>
                            <input type="text" class="form-control" id="nombreLista" required>
                            <div id="nombreListaError" class="invalid-feedback">Por favor ingrese el nombre de la lista.</div>
                        </div>
                        <div class="mb-3">
                            <label for="descripcionLista" class="form-label">Descripción: </label>
                            <input type="text" class="form-control" id="descripcionLista" required>
                            <div id="descripcionListaError" class="invalid-feedback">Por favor ingrese la descripción.</div>
                        </div>
                        <div class="mb-3">
                            <label for="contenedorUtiles" class="form-label">Utiles: </label>
                            <div class="contenedorUtiles"></div>
                        </div>
                        <div class="mb-3">
                            <label for="crearGradoLista" class="form-label">Grado: </label>
                            <select id="crearGradoLista" class="form-select editarGrado">
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Volver</button>
                    <button type="submit" form="crearListaForm" id="btnCrearLista" class="btn btn-primary">Crear Lista</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editarListaModal" tabindex="-1" aria-labelledby="editarListaLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">        
                <div class="modal-header">
                    <h5 class="modal-title" id="editarListaLabel">Editar Útiles</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form id="editarListaForm">
                        <input type="hidden" id="editarIdLista">
                        <div class="mb-3">
                            <label for="editarNombreLista" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="editarNombreLista" required>
                        </div>
                        <div class="mb-3">
                            <label for="editarDescripcionLista" class="form-label">Descripción</label>
                            <input type="text" class="form-control" id="editarDescripcionLista" required>
                        </div>
                        <div class="mb-3">
                            <label for="contenedorUtiles" class="form-label">Utiles: </label>
                            <div class="contenedorUtiles"></div>
                        </div>
                        <div class="mb-3">
                            <label for="editarGradoLista" class="form-label">Grado:</label>
                            <select id="editarGradoLista" class="form-select editarGrado">
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" form="editarListaForm" class="btnGuardar btn btn-primary" id="btnGuardarEdicionLista">Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>

    <div id="loading" class="cargar">
        <img src="images/loading2.gif" alt="Cargando..." style="width:100%; height:100%;">
    </div>

    <!-- Div de sombra -->
    <div id="shadow" class="sombra"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script src="js/usuario_mep-listar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/registrar-usuario-administrador.js"></script>
    <script src="js/usuario-inicias.js"></script>
    <script src="/js/funcionalidades-docente.js"></script>
    <script src="/js/listas-listar.js"></script>
    <script src="/js/animaciones.js"></script>

</body>
</html>
