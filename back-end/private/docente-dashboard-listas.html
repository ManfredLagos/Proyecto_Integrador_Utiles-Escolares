<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docente | Ministario de Educación Pública</title>
    <link rel="icon" href="/images/logo_mep.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/administrador-dashboard.css">
</head>
<body class="contenedor-dashboar-docente">
    <div class="row" id="fila">
        <div class="col-2" id="columna-1">
            <div class="menuLateral">
                <div class="row" id="nombreUsuarioDocente">
                    <div id="cargarNombreUsuarioDocente"></div>
                </div>
                <div class="row" id="menuLateral">
                    <div class="menu-item">
                        <div class="icon-col"><img src="images/hogar.png" alt="Casa"></div>
                        <div class="text-col"><a href="/docente-dashboard">Inicio</a></div>
                    </div>
                    <div class="menu-item">
                        <div class="icon-col"><img src="images/portapapeles.png" alt="Listas"></div>
                        <div class="text-col"><a href="/docente-dashboard-listas">Listas</a></div>
                    </div>
                    <div class="menu-item">
                        <div class="icon-col"><img src="images/configuraciones.png" alt="Listas"></div>
                        <div class="text-col" id="opcionesConfiguracion"><a href="#">Configuración</a></div>
                    </div>
                    <ul class="listaConfiguración">
                        <li><a href="/docente-dashboard-configuracion">Editar información</a></li>
                        <li><a href="/iniciar">Cerrar Sesión</a></li>
                    </ul>
                </div>
            </div>
        </div>
        
        <div class="col-10" id="columna-2">
            <div class="row" id="docenteInicio">
                <div class="col-8" id="columna-3">
                    <h1>Panel de Docente</h1>
                    <h2>Listas de útiles escolares</h1>
                </div>
                <div class="col-4" id="columna-4">
                    <button id="crearLista" data-bs-toggle="modal" data-bs-target="#crearListaModal">Crear Nueva Lista</button>
                </div>
            </div>
            <div class="row" style="padding: 20px;">
                <table id="tablaListas" class="table table-striped table-bordered">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th class="text-center">Útiles</th>
                            <th class="text-center">Grados</th>
                            <th class="text-center">Acción</th>
                            <th class="text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaLista">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="crearListaModal" tabindex="-1" aria-labelledby="listaModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">           
                <div class="modal-header">
                    <h5 class="modal-title" id="listaModalLabel">Registrar Lista</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>             
                <div class="modal-body">
                    <form id="crearListaForm" novalidate>
                        <div class="mb-3">
                            <label for="nombreLista" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombreUtil" required>
                            <div id="nombreUtilError" class="invalid-feedback">Por favor ingrese el nombre del nuevo útil.</div>
                        </div>
                        <div class="mb-3">
                            <label for="descripcionUtil" class="form-label">Descripción</label>
                            <input type="text" class="form-control" id="descripcionUtil" required>
                            <div id="descripcionUtilError" class="invalid-feedback">Por favor ingrese la descripción.</div>
                        </div>
                        <div class="mb-3">
                            <label for="editarListaGrado" class="form-label">Grado</label>
                            <select id="listaGrado" name="lista" class="form-select editarListaGrado" required>
                            
                            </select>
                            <div id="rolError" class="invalid-feedback">Seleccione un grado.</div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Volver</button>
                    <button type="submit" form="crearListaForm" id="btnCrearLista" class="btn btn-primary">Crear Lista</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editarListaModal" tabindex="-1" aria-labelledby="editarListaLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">        
                <div class="modal-header">
                    <h5 class="modal-title" id="editarListaLabel">Editar Útiles</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form id="editarListaForm">
                        <input type="hidden" id="editarIdLista">
                        <div class="mb-3">
                            <label for="editarNombreLista" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="editarNombreLista" required>
                        </div>
                        <div class="mb-3">
                            <label for="editarDescripcionLista" class="form-label">Descripción</label>
                            <input type="text" class="form-control" id="editarDescripcionLista" required>
                        </div>
                        <div class="mb-3">
                            <label for="editarListaGrado" class="form-label">Lista</label>
                            <select id="editarListaGrado" class="form-select editarListaGrado" required>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" form="editarListaForm" class="btn btn-primary" id="btnGuardarEdicionLista">Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Incluir Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script src="js/usuario_mep-listar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/registrar-usuario-administrador.js"></script>
    <script src="/js/listas-listar.js"></script>
</body>
</html>
