<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador | Ministario de Educación Pública</title>
    <link rel="icon" href="/images/logo_mep.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/administrador-dashboard.css">
</head>
<body class="contenedor-dashboar-administrador">
    
    <div class="row" id="fila">
        <div class="col-2" id="columna-1">
            <div class="menuLateral">
                <div class="row" id="nombreUsuario">
                    <div id="cargarNombreUsuario"></div>
                </div>
                <div class="row" id="menuLateral">
                    <div class="menu-item">
                        <div class="icon-col"><img src="images/hogar.png" alt="imgCasa"></div>
                        <div class="text-col"><a href="/administrador-dashboard">Inicio</a></div>
                    </div>
                    <div class="menu-item">
                        <div class="icon-col"><img src="images/anadir-grupo.png" alt="imgUsuario"></div>
                        <div class="text-col"><a href="/administrador-dashboard-usuarios">Usuarios</a></div>
                    </div>
                    <div class="menu-item" style="background-color: #d1d1d1;">
                        <div class="icon-col"><img src="images/conocimiento.png" alt="imgGrado"></div>
                        <div class="text-col"><a href="/administrador-dashboard-grados">Grados</a></div>
                    </div>
                    <div class="menu-item" id="menuLateralUtiles">
                        <div class="icon-col"><img src="images/utiles-escolares (1).png" alt="imgÚtiles"></div>
                        <div class="text-col"><a href="/administrador-dashboard-utiles">Útiles</a></div>
                    </div>
                    <div class="menu-item">
                        <div class="icon-col"><img src="images/configuraciones.png" alt="imgConfiguración"></div>
                        <div class="text-col" id="opcionesConfiguracion"><a href="#">Configuración</a></div>
                    </div>
                    <ul class="listaConfiguracion">
                        <li><a href="/iniciar">Cerrar Sesión</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="col-10" id="columna-2">
            <div class="row" id="administradorInicio">
                <div class="col-8" id="columna-3">
                    <h1>Panel de administrador</h1>
                    <h2>Lista de grados</h1>
                </div>
                <div class="col-4" id="columna-4">
                    <button class="crearUsuario" id="crearGrado" data-bs-toggle="modal" data-bs-target="#crearGradoModal">Crear Nuevo Grado</button>
                </div>
            </div>
            <div class="row" style="padding: 20px;">
                <table id="tablaGrados" class="table table-striped table-bordered">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th class="text-center">Nivel</th>
                            <th class="text-center">Acción</th>
                            <th class="text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaGrados">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="crearGradoModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">         
                <div class="modal-header">
                    <h5 class="modal-title" id="gradoModalLabel">Registrar Grado</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>         
                <div class="modal-body">
                    <form id="crearGradoForm" novalidate>
                        <div class="mb-3">
                            <label for="nombreGrado" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombreGrado" required>
                            <div id="nombreGradoError" class="invalid-feedback">Por favor ingrese el nombre del grado.</div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="descripcionGrado" class="form-label">Descripción</label>
                            <input type="text" class="form-control" id="descripcionGrado" required>
                            <div id="descripcionGradoError" class="invalid-feedback">Por favor ingrese una descripción válida.</div>
                        </div>
                        <div class="mb-3">
                            <label for="nivelGrado" class="form-label">Nivel</label>
                            <input type="email" class="form-control" id="nivelGrado" required>
                            <div id="nivelGradoError" class="invalid-feedback">Ingrese un correo válido.</div>
                        </div>   
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Volver</button>
                    <button type="submit" form="crearGradoForm" id="btnCrearGrado" class="btn btn-primary">Crear Grado</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editarGradoModal" tabindex="-1" aria-labelledby="editarUsuarioLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editarGradoLabel">Editar Grado</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <form id="editarGradoForm">
                    <input type="hidden" id="editarIdGrado">
                    <div class="mb-3">
                        <label for="editarNombreGrado" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="editarNombreGrado" required>
                    </div>
                    <div class="mb-3">
                        <label for="editarDescripcionGrado" class="form-label">Descripción</label>
                        <input type="text" class="form-control" id="editarDescripcionGrado" required>
                    </div>
                    <div class="mb-3">
                        <label for="editarNivelGrado" class="form-label">Nivel</label>
                        <input type="number" class="form-control" id="editarNivelGrado" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" form="editarGradoForm" class="btnGuardar btn btn-primary" id="btnGuardarEdicionGrado">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script src="/js/usuario_mep-listar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/registrar-usuario-administrador.js"></script>
    <script src="/js/registrar-usuario-administrador.js"></script>
    <script src="/js/grados-listar.js"></script>

</body>
</html>
